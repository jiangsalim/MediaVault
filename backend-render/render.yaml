services:
  - type: web
    name: mediavault-api
    env: python
    rootDir: backend-render
    buildCommand: pip install -r requirements.txt && curl -L https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz -o ffmpeg.tar.xz && tar -xf ffmpeg.tar.xz && mv ffmpeg-master-latest-linux64-gpl/bin/ffmpeg /usr/local/bin/ && mv ffmpeg-master-latest-linux64-gpl/bin/ffprobe /usr/local/bin/
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9