<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{display:flex;align-items:center;justify-content:center;height:100vh;background:#0A0A0A;font-family:system-ui,-apple-system,sans-serif}
    .splash{text-align:center;animation:fadeIn 600ms ease}
    .splash svg{margin-bottom:24px;animation:pulse 2s infinite}
    .splash h1{color:#fff;font-size:28px;font-weight:700;margin-bottom:8px}
    .splash p{color:#999;font-size:14px}
    @keyframes fadeIn{from{opacity:0;transform:scale(0.95)}to{opacity:1;transform:scale(1)}}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.5}}
  </style>
</head>
<body>
  <div class="splash">
    <svg width="80" height="80" viewBox="0 0 40 40"><polygon points="20,2 36,11 36,29 20,38 4,29 4,11" stroke="#FFFFFF" stroke-width="2.5" fill="none"/><polyline points="12,18 20,26 28,18" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
    <h1>MediaVault</h1>
    <p>Free Media Toolkit</p>
  </div>
  <script>setTimeout(function(){window.location.href='index.html'},1500)</script>
</body>
</html>
