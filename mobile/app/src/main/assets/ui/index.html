<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#0A1F3F">
  <title>MediaVault — Free Downloads</title>
  <link rel="stylesheet" href="css/base/reset.css">
  <link rel="stylesheet" href="css/base/variables.css">
  <link rel="stylesheet" href="css/layout/app-shell.css">
  <link rel="stylesheet" href="css/layout/header.css">
  <link rel="stylesheet" href="css/layout/bottom-nav.css">
  <link rel="stylesheet" href="css/components/tabs.css">
  <link rel="stylesheet" href="css/components/inputs.css">
  <link rel="stylesheet" href="css/components/cards.css">
  <link rel="stylesheet" href="css/components/hamburger.css">
  <link rel="stylesheet" href="css/components/system.css">
  <link rel="stylesheet" href="css/pages/home.css">
  <link rel="stylesheet" href="css/pages/search.css">
  <link rel="stylesheet" href="css/pages/download.css">
  <link rel="stylesheet" href="css/pages/player.css">
  <link rel="stylesheet" href="css/pages/profile.css">
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header id="app-header">
      <div class="header-left">
        <button class="icon-button" id="btn-hamburger" aria-label="Menu">☰</button>
        <span class="app-logo">
          <svg width="28" height="28" viewBox="0 0 40 40" fill="none"><polygon points="20,2 36,11 36,29 20,38 4,29 4,11" stroke="#00C2BA" stroke-width="2.5" fill="none"/><polyline points="12,18 20,26 28,18" stroke="#00C2BA" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
          <span>MediaVault</span>
        </span>
      </div>
      <div class="header-right">
        <button class="icon-button" id="btn-search-icon" aria-label="Search">🔍</button>
        <button class="icon-button download-icon" id="btn-download-icon" aria-label="Downloads">⬇<span class="icon-badge" id="download-badge"></span></button>
      </div>
    </header>

    <!-- Platform Tabs -->
    <div class="platform-tabs" id="platform-tabs">
      <button class="tab-chip active" data-platform="all">All</button>
      <button class="tab-chip" data-platform="youtube">YouTube</button>
      <button class="tab-chip" data-platform="spotify">Spotify</button>
      <button class="tab-chip" data-platform="tiktok">TikTok</button>
      <button class="tab-chip" data-platform="instagram">Instagram</button>
      <button class="tab-chip" data-platform="facebook">Facebook</button>
      <button class="tab-chip" data-platform="soundcloud">SoundCloud</button>
      <button class="tab-chip" data-platform="music">🎵 Music</button>
      <button class="tab-chip" data-platform="more">More</button>
    </div>

    <!-- Search Bar with Paste & Voice -->
    <div class="search-bar">
      <span class="search-icon">🔍</span>
      <input type="text" id="search-input-main" placeholder="Search or paste URL..." autocomplete="off">
      <button class="paste-btn" id="btn-paste-url" title="Paste URL">📋</button>
      <button class="voice-btn" id="btn-voice-search" title="Voice Search">🎤</button>
      <button class="search-submit" id="btn-search-submit">Search</button>
    </div>

    <!-- Pages -->
    <main id="main-content">
      <section id="page-home" class="page active"><div id="home-content"></div></section>
      <section id="page-search" class="page"><div id="search-content"></div></section>
      <section id="page-music" class="page"><div id="music-content"></div></section>
      <section id="page-player" class="page"><div id="player-content"></div></section>
      <section id="page-downloads" class="page"><div id="downloads-content"></div></section>
      <section id="page-profile" class="page"><div id="profile-content"></div></section>
    </main>

    <!-- Bottom Navigation -->
    <nav id="bottom-nav">
      <button class="nav-item active" data-page="home"><span class="nav-icon">🏠</span><span class="nav-label">Home</span></button>
      <button class="nav-item" data-page="search"><span class="nav-icon">🔍</span><span class="nav-label">Search</span></button>
      <button class="nav-item" data-page="player"><span class="nav-icon">▶</span><span class="nav-label">Player</span></button>
      <button class="nav-item" data-page="downloads"><span class="nav-icon">⬇</span><span class="nav-label">Downloads</span><span class="nav-badge" id="bottom-download-badge"></span></button>
      <button class="nav-item" data-page="profile"><span class="nav-icon">👤</span><span class="nav-label">Profile</span></button>
    </nav>
  </div>

  <!-- Bottom Sheet for Quality Selection -->
  <div class="bottom-sheet-overlay" id="sheet-overlay"></div>
  <div class="bottom-sheet" id="bottom-sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-body" id="sheet-body"></div>
  </div>

  <!-- Toast Container -->
  <div id="toast-container"></div>

  <script src="js/config.js"></script>
  <script src="js/core/router.js"></script>
  <script src="js/ui/hamburger.js"></script>
  <script src="js/ui/system.js"></script>
  <script src="js/pages/home.js"></script>
  <script src="js/pages/search.js"></script>
  <script src="js/pages/download.js"></script>
  <script src="js/pages/player.js"></script>
  <script src="js/pages/profile.js"></script>
  <script src="js/pages/tools.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
