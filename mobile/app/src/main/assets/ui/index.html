<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#1A1A1A">
  <title>MediaVault</title>
  <link rel="stylesheet" href="css/base/reset.css">
  <link rel="stylesheet" href="css/base/variables.css">
  <link rel="stylesheet" href="css/layout/app-shell.css">
  <link rel="stylesheet" href="css/layout/header.css">
  <link rel="stylesheet" href="css/layout/bottom-nav.css">
  <link rel="stylesheet" href="css/components/tabs.css">
  <link rel="stylesheet" href="css/components/inputs.css">
  <link rel="stylesheet" href="css/components/cards.css">
  <link rel="stylesheet" href="css/pages/download.css">
  <link rel="stylesheet" href="css/pages/music.css">
</head>
<body>
  <div id="app">
    <header id="app-header">
      <div class="header-left">
        <button class="icon-button hamburger-btn" id="btn-hamburger">☰</button>
        <span class="app-logo">MediaVault</span>
      </div>
      <div class="header-right">
        <button class="icon-button" id="btn-search-icon">🔍</button>
        <button class="icon-button download-icon" id="btn-download-icon">⬇<span class="icon-badge"></span></button>
      </div>
    </header>
    <div class="platform-tabs">
      <button class="tab-chip active">All</button>
      <button class="tab-chip">YouTube</button>
      <button class="tab-chip">Music</button>
      <button class="tab-chip">More</button>
      <button class="tab-chip">Sub</button>
    </div>
    <div class="search-bar">
      <span class="search-icon">🔍</span>
      <input type="text" id="search-input" placeholder="Search or paste URL..." autocomplete="off">
      <button class="voice-search-btn" id="btn-voice">🎤</button>
    </div>
    <main id="main-content">
      <div id="page-container">
        <section id="page-download" class="page active"><div id="download-content"></div></section>
        <section id="page-play" class="page">
          <div id="play-content">
            <div class="section-title">Downloaded</div>
            <div style="text-align:center;padding:40px;color:var(--color-text-secondary);"><div style="font-size:3rem;margin-bottom:12px;">📁</div><p>No downloads yet</p></div>
          </div>
        </section>
        <section id="page-settings" class="page">
          <div id="settings-content">
            <div class="settings-section"><div class="settings-section-title">General</div>
              <div class="list-item"><span class="item-info"><span class="item-title">Download settings</span></span><span class="item-chevron">›</span></div>
              <div class="list-item"><span class="item-info"><span class="item-title">Notification settings</span></span><span class="item-chevron">›</span></div>
              <div class="list-item"><span class="item-info"><span class="item-title">Theme</span></span><span class="item-value">Dark</span><span class="item-chevron">›</span></div>
            </div>
            <div class="settings-section"><div class="settings-section-title">Download tools</div>
              <div class="list-item"><span class="item-info"><span class="item-title">Recover deleted files</span></span><span class="item-chevron">›</span></div>
              <div class="list-item"><span class="item-info"><span class="item-title">WhatsApp status saver</span></span><span class="item-chevron">›</span></div>
              <div class="list-item"><span class="item-info"><span class="item-title">Vault</span></span><span class="item-chevron">›</span></div>
            </div>
          </div>
        </section>
      </div>
    </main>
    <nav id="bottom-nav">
      <button class="nav-item active" data-page="download"><span class="nav-icon">⬇</span><span class="nav-label">Download</span></button>
      <button class="nav-item" data-page="play"><span class="nav-icon">▶</span><span class="nav-label">Play</span></button>
      <button class="nav-item" data-page="settings"><span class="nav-icon">⚙</span><span class="nav-label">Settings</span></button>
    </nav>
  </div>
  <div class="bottom-sheet-overlay" id="download-sheet-overlay"></div>
  <div class="bottom-sheet" id="download-sheet"><div class="sheet-handle"></div><div class="sheet-body" id="download-sheet-body"></div></div>
  <script src="js/config.js"></script>
  <script src="js/core/router.js"></script>
  <script src="js/pages/download.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
