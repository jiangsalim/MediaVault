<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#0A1F3F">
  <title>MediaVault — Free Downloads</title>
  <link rel="stylesheet" href="css/base/reset.css">
  <link rel="stylesheet" href="css/base/variables.css">
  <link rel="stylesheet" href="css/layout/app-shell.css">
  <link rel="stylesheet" href="css/layout/header.css">
  <link rel="stylesheet" href="css/layout/bottom-nav.css">
  <link rel="stylesheet" href="css/components/tabs.css">
  <link rel="stylesheet" href="css/components/inputs.css">
  <link rel="stylesheet" href="css/components/cards.css">
  <link rel="stylesheet" href="css/components/hamburger.css">
  <link rel="stylesheet" href="css/components/system.css">
  <link rel="stylesheet" href="css/pages/home.css">
  <link rel="stylesheet" href="css/pages/download.css">
  <link rel="stylesheet" href="css/pages/player.css">
  <link rel="stylesheet" href="css/pages/profile.css">
</head>
<body>
  <div id="app">
    <!-- Simple Top Bar — Logo + Hamburger + Download Badge -->
    <header id="app-header">
      <div class="header-left">
        <button class="icon-button" id="btn-hamburger" aria-label="Menu">☰</button>
        <span class="app-logo">
          <svg width="28" height="28" viewBox="0 0 40 40" fill="none"><polygon points="20,2 36,11 36,29 20,38 4,29 4,11" stroke="#00C2BA" stroke-width="2.5" fill="none"/><polyline points="12,18 20,26 28,18" stroke="#00C2BA" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
          <span>MediaVault</span>
        </span>
      </div>
      <div class="header-right">
        <button class="icon-button download-icon" id="btn-download-icon" aria-label="Downloads">⬇<span class="icon-badge" id="download-badge"></span></button>
      </div>
    </header>

    <!-- Main Content — Single Page, No Tabs -->
    <main id="main-content">
      <!-- Home Page (Default) -->
      <section id="page-home" class="page active">
        <!-- Google-Style Centered Search -->
        <div class="hero-search" style="padding:var(--space-xl) var(--space-md);">
          <h1 style="text-align:center;font-size:1.5rem;font-weight:700;margin-bottom:var(--space-lg);color:var(--color-text-primary);">What do you want to download?</h1>
          <div class="search-bar-main" style="max-width:600px;margin:0 auto;">
            <div class="search-input-wrapper" style="display:flex;align-items:center;background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-full);padding:4px 4px 4px 20px;box-shadow:var(--shadow-sm);">
              <span style="color:var(--color-text-tertiary);margin-right:12px;">🔍</span>
              <input type="text" id="search-input-main" placeholder="Search or paste URL..." autocomplete="off" style="flex:1;border:none;outline:none;font-size:var(--font-size-base);background:transparent;color:var(--color-text-primary);padding:12px 0;">
              <button class="icon-button" id="btn-voice-search" title="Voice Search" style="margin-right:8px;">🎤</button>
            </div>
          </div>
          <!-- Suggestions Dropdown -->
          <div id="suggestions-container" style="max-width:600px;margin:8px auto 0;display:none;"></div>
        </div>

        <!-- Results Container (shows when searching) -->
        <div id="results-container" style="display:none;"></div>

        <!-- Default Home Content (shows when not searching) -->
        <div id="home-content"></div>
      </section>

      <!-- Player Page -->
      <section id="page-player" class="page"><div id="player-content"></div></section>
      <!-- Downloads Page -->
      <section id="page-downloads" class="page"><div id="downloads-content"></div></section>
      <!-- Profile Page -->
      <section id="page-profile" class="page"><div id="profile-content"></div></section>
    </main>

    <!-- Bottom Navigation -->
    <nav id="bottom-nav">
      <button class="nav-item active" data-page="home"><span class="nav-icon">🏠</span><span class="nav-label">Home</span></button>
      <button class="nav-item" data-page="player"><span class="nav-icon">▶</span><span class="nav-label">Player</span></button>
      <button class="nav-item" data-page="downloads"><span class="nav-icon">⬇</span><span class="nav-label">Downloads</span><span class="nav-badge" id="bottom-download-badge"></span></button>
    </nav>
  </div>

  <!-- Bottom Sheet -->
  <div class="bottom-sheet-overlay" id="sheet-overlay"></div>
  <div class="bottom-sheet" id="bottom-sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-body" id="sheet-body"></div>
  </div>

  <!-- Toast Container -->
  <div id="toast-container"></div>
  <!-- Hamburger Drawer -->
  <div id="hamburger-drawer" class="hamburger-drawer">
    <div class="drawer-overlay" onclick="document.getElementById("hamburger-drawer").classList.remove("open")"></div>
    <div class="drawer-content">
      <div class="drawer-header">
        <svg width="36" height="36" viewBox="0 0 40 40" fill="none"><polygon points="20,2 36,11 36,29 20,38 4,29 4,11" stroke="#00C2BA" stroke-width="2.5" fill="none"/><polyline points="12,18 20,26 28,18" stroke="#00C2BA" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
        <div><div style="font-weight:700;">MediaVault</div><div style="font-size:12px;color:var(--color-text-tertiary);">Free Media Toolkit</div></div>
      </div>
      <div class="drawer-menu">
        <button class="drawer-item" onclick="document.getElementById("hamburger-drawer").classList.remove("open");Router.navigate("home")">🏠 Home</button>
        <button class="drawer-item" onclick="document.getElementById("hamburger-drawer").classList.remove("open");Router.navigate("downloads")">⬇ Downloads</button>
        <button class="drawer-item" onclick="document.getElementById("hamburger-drawer").classList.remove("open");Router.navigate("player")">▶ Player</button>
        <button class="drawer-item" onclick="document.getElementById("hamburger-drawer").classList.remove("open");Router.navigate("profile")">👤 Profile</button>
        <div class="drawer-divider"></div>
        <button class="drawer-item" onclick="document.getElementById("hamburger-drawer").classList.remove("open");System.toast("Opening...")">💬 Status Saver</button>
        <button class="drawer-item" onclick="document.getElementById("hamburger-drawer").classList.remove("open");System.toast("Opening...")">🔒 Private Vault</button>
        <button class="drawer-item" onclick="document.getElementById("hamburger-drawer").classList.remove("open");System.toast("Opening...")">🧹 Phone Cleaner</button>
        <div class="drawer-divider"></div>
        <button class="drawer-item" onclick="var t=document.documentElement.getAttribute("data-theme")||"light";var n=t==="light"?"dark":"light";document.documentElement.setAttribute("data-theme",n);localStorage.setItem("mv_theme",n);document.getElementById("hamburger-drawer").classList.remove("open")">🌙 Theme</button>
        <button class="drawer-item" onclick="document.getElementById("hamburger-drawer").classList.remove("open");System.toast("⭐ Rate us!")">⭐ Rate App</button>
        <button class="drawer-item" onclick="document.getElementById("hamburger-drawer").classList.remove("open");System.toast("📤 Share")">📤 Share App</button>
        <a class="drawer-item" href="https://herman-software-website.vercel.app" target="_blank">🌐 HERMAN Software</a>
      </div>
      <div class="drawer-footer"><span style="font-size:12px;color:var(--color-text-tertiary);">v2.0.0</span></div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/core/youtube-api.js"></script>
  <script src="js/core/badges.js"></script>
  <script src="js/core/router.js"></script>
  <script src="js/ui/hamburger.js"></script>
  <script src="js/ui/system.js"></script>
  <script src="js/pages/home.js"></script>
  <script src="js/pages/download.js"></script>
  <script src="js/pages/player.js"></script>
  <script src="js/pages/profile.js"></script>
  <script src="js/pages/tools.js"></script>
  <script src="js/pages/more.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
