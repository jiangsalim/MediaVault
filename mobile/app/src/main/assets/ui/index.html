<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#0A0A0A">
  <title>MediaVault — Free Downloads</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    
    <!-- Offline Banner -->
    <div id="offline-banner">No internet connection</div>

    <!-- Header -->
    <header id="header">
      <div id="header-left">
      <button id="btn-menu" aria-label="Menu">☰</button>
      <span class="logo" onclick="Router.go("home")" style="cursor:pointer;">MediaVault</span>
      </div><div id="header-right"><button id="btn-dl-icon" style="margin-left:auto" onclick="Router.go("downloads")" aria-label="Downloads">⬇<span id="dl-badge"></span></button>
    </div></header>

    <!-- Main Content -->
    <main id="main">
      <!-- Home Page -->
      <section id="page-home" class="page active"></section>
      <!-- Player Page -->
      <section id="page-player" class="page"></section>
      <!-- Downloads Page -->
      <section id="page-downloads" class="page"></section>
      <!-- Profile Page -->
      <section id="page-favorites" class="page"></section>
      <section id="page-profile" class="page"></section>
    </main>

    <!-- Bottom Navigation -->
    <nav id="bottom-nav">
      <button class="nav-btn active" data-page="home">🏠</button>
      <button class="nav-btn" data-page="player">▶</button>
      <button class="nav-btn" data-page="downloads">⬇</button>
      <button class="nav-btn" data-page="profile">👤</button>
    </nav>
  </div>

  <!-- Hamburger Drawer -->
  <div id="drawer">
    <div class="drawer-header">
      <svg width="32" height="32" viewBox="0 0 40 40"><polygon points="20,2 36,11 36,29 20,38 4,29 4,11" stroke="currentColor" stroke-width="2.5" fill="none"/><polyline points="12,18 20,26 28,18" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
      <div>
        <div style="font-weight:700;">MediaVault</div>
        <div style="font-size:12px;color:var(--text-tertiary);">Free Media Toolkit</div>
      </div>
    </div>
    <div class="drawer-menu" id="drawer-menu"></div>
    <div class="drawer-footer">v3.0.0</div>
  </div>

  <!-- Overlay -->
  <div id="overlay" onclick="Sheet.hide()"></div>

  <!-- Bottom Sheet -->
  <div id="sheet">
    <div class="sheet-handle"></div>
    <div id="sheet-body"></div>
  </div>

  <!-- Toast -->
  <div id="toast"></div>

  <!-- Scripts -->
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
  <script src="js/router.js"></script>
  <script src="js/api.js"></script>
  <script src="js/system.js"></script>
  <script src="js/badges.js"></script>
  <script src="js/favorites.js"></script>
  <script src="js/extras.js"></script>
  <script src="js/home.js"></script>
  <script src="js/downloads.js"></script>
  <script src="js/player.js"></script>
  <script src="js/profile.js"></script>
  <script src="js/tools.js"></script>
</body>
</html>
<script>
window.onerror = function(msg, url, line) {
  var el = document.createElement('div');
  el.style.cssText = 'position:fixed;bottom:0;left:0;right:0;background:#D32F2F;color:#fff;padding:8px;font-size:11px;z-index:9999;';
  el.textContent = 'Error: ' + msg + ' (line ' + line + ')';
  document.body.appendChild(el);
};
</script>
